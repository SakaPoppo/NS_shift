{% extends "core/base.html" %}
{% load static %}

{% block title %}メインページ | Ns Shift{% endblock %}

{% block content %}
  <section class="mx-auto w-full max-w-[1040px] px-5 py-10 sm:px-8 lg:px-10">
    <div class="flex flex-col items-center">
      <div class="mb-9 text-center">
        <h1 class="text-[1.6rem] font-black leading-tight tracking-tight text-slate-900">
          メインページ
        </h1>
        <p class="mt-2 text-sm font-medium text-slate-600">
          管理する項目を選択してください
        </p>
      </div>

      <div class="grid w-full grid-cols-1 gap-8 md:grid-cols-2">
        <a
          href="{% url 'shifts:list' %}"
          class="group overflow-hidden rounded-xl bg-white shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-md"
        >
          <div class="aspect-[857/459] overflow-hidden bg-sky-50">
            <img
              class="h-full w-full object-cover"
              src="{% static 'core/images/シフト用.png' %}"
              alt="シフト管理画面のイメージ"
            >
          </div>

          <div class="px-10 py-9 text-center">
            <h2 class="text-[1.6rem] font-black text-slate-900">
              シフト管理
            </h2>
            <p class="mx-auto mt-4 max-w-[280px] text-sm leading-6 text-slate-700">
              勤務表の作成・編集・確認を行います
            </p>
            <div class="mt-6 inline-flex items-center gap-2 text-sm font-bold text-brand-500">
              <span>管理画面へ移動</span>
              <span class="transition group-hover:translate-x-1">→</span>
            </div>
          </div>
        </a>

        <a
          href="{% url 'staff:list' %}"
          class="group overflow-hidden rounded-xl bg-white shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-md"
        >
          <div class="aspect-[857/459] overflow-hidden bg-sky-50">
            <img
              class="h-full w-full object-cover"
              src="{% static 'core/images/スタッフ用.png' %}"
              alt="スタッフ管理画面のイメージ"
            >
          </div>

          <div class="px-10 py-9 text-center">
            <h2 class="text-[1.6rem] font-black text-slate-900">
              スタッフ管理
            </h2>
            <p class="mx-auto mt-4 max-w-[290px] text-sm leading-6 text-slate-700">
              スタッフ情報を登録・編集・確認を行います
            </p>
            <div class="mt-6 inline-flex items-center gap-2 text-sm font-bold text-brand-500">
              <span>管理画面へ移動</span>
              <span class="transition group-hover:translate-x-1">→</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </section>
{% endblock %}
