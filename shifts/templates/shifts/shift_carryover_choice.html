{% extends "core/base.html" %}

{% block title %}前月末情報の設定 | Ns Shift{% endblock %}

{% block content %}
  <section class="mx-auto w-full max-w-2xl px-5 py-8 sm:px-8 lg:px-10">
    <div class="ns-page-panel-strong p-6 sm:p-8">

      <p class="text-sm font-semibold text-slate-500">
        シフト管理 &gt; 前月末情報
      </p>

      <h1 class="mt-2 text-[1.9rem] font-black tracking-tight text-slate-900">
        前月末の勤務情報を設定
      </h1>

      <p class="mt-3 text-sm font-medium leading-6 text-slate-600">
        前月のシフトから自動取得するか、<br class="sm:hidden">
        手動で入力するかを選択してください。
      </p>

      <form method="post" class="mt-7 grid gap-4 sm:grid-cols-2">
        {% csrf_token %}

        <!-- 前月シフトから自動取得 -->
        <button
          type="submit"
          name="use_previous_plan"
          value="yes"
          class="relative min-h-36 rounded-xl border border-brand-600 bg-brand-600 px-6 py-5 text-left text-white transition hover:border-brand-700 hover:bg-brand-700"
        >
          <span
            class="absolute right-4 top-4 rounded-full bg-white/20 px-3 py-1 text-[11px] font-bold text-white"
          >
            おすすめ
          </span>

          <span class="block pr-20 text-base font-black leading-6">
            前月シフトから<br>
            自動取得
          </span>

          <span class="mt-4 block text-xs font-medium leading-5 text-white/90">
            前月末の勤務状況を<br>
            自動で取得します
          </span>
        </button>

        <!-- 手動入力 -->
        <button
          type="submit"
          name="use_previous_plan"
          value="no"
          class="min-h-36 rounded-xl border border-slate-300 bg-white px-6 py-5 text-left text-slate-700 transition hover:border-sky-300 hover:bg-sky-50"
        >
          <span class="block text-base font-black leading-6 text-slate-800">
            手動で入力する
          </span>

          <span class="mt-4 block text-xs font-medium leading-5 text-slate-500">
            スタッフごとに前月末の<br>
            勤務状況を入力します
          </span>
        </button>

      </form>
    </div>
  </section>
{% endblock %}
