databases:
  - name: ns-shift-db
    plan: free
    region: singapore
    databaseName: ns_shift
    user: ns_shift

services:
  - type: web
    plan: free
    name: ns-shift-web
    runtime: python
    region: singapore
    buildCommand: "bash ./build.sh build"
    startCommand: "bash ./build.sh start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ns-shift-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
